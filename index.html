<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BotPacker — Instant Node.js Bot Bundler</title>
  <script src="https://tailwindcss.com"></script>
  <script src="https://jsdelivr.net"></script>
  <script src="https://cloudflare.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans">

  <!-- Navbar -->
  <nav class="border-b border-slate-800 bg-slate-900/50 px-6 py-4 flex justify-between items-center">
    <div class="flex items-center gap-2 font-bold text-xl text-indigo-400">
      <span>⚡ BotPacker</span>
    </div>
    <div id="user-nav" class="hidden flex items-center gap-4">
      <span id="user-email" class="text-sm text-slate-400"></span>
      <button onclick="logout()" class="text-sm bg-slate-800 hover:bg-slate-700 px-3 py-1.5 rounded-lg transition">Logout</button>
    </div>
  </nav>

  <!-- Auth Screen -->
  <main id="auth-section" class="max-w-md mx-auto mt-20 p-6 bg-slate-900 border border-slate-800 rounded-2xl shadow-xl">
    <h1 class="text-2xl font-bold mb-2">Sign in to BotPacker</h1>
    <p class="text-slate-400 text-sm mb-6">Bundle your Node.js bot scripts into a ready-to-host ZIP in seconds.</p>
    
    <div class="space-y-4">
      <div>
        <label class="block text-xs uppercase tracking-wider text-slate-400 mb-1">Email</label>
        <input id="email" type="email" placeholder="you@example.com" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-4 py-2.5 focus:outline-none focus:border-indigo-500">
      </div>
      <div>
        <label class="block text-xs uppercase tracking-wider text-slate-400 mb-1">Password</label>
        <input id="password" type="password" placeholder="••••••••" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-4 py-2.5 focus:outline-none focus:border-indigo-500">
      </div>
      <div class="flex gap-3 pt-2">
        <button onclick="signIn()" class="flex-1 bg-indigo-600 hover:bg-indigo-500 font-medium py-2.5 rounded-lg transition">Login</button>
        <button onclick="signUp()" class="flex-1 bg-slate-800 hover:bg-slate-700 font-medium py-2.5 rounded-lg transition">Sign Up</button>
      </div>
      <p id="auth-msg" class="text-sm text-center text-amber-400 pt-2"></p>
    </div>
  </main>

  <!-- Dashboard Screen -->
  <main id="app-section" class="hidden max-w-5xl mx-auto mt-10 px-6 pb-20">
    <div class="grid md:grid-cols-3 gap-6">
      
      <!-- Left Column: Settings & Env -->
      <div class="space-y-6">
        <div class="bg-slate-900 border border-slate-800 p-5 rounded-2xl">
          <h2 class="font-semibold text-lg mb-4 text-indigo-400">1. Bot Settings</h2>
          
          <label class="block text-xs text-slate-400 mb-1">Bot Name</label>
          <input id="bot-name" type="text" value="my-discord-bot" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-sm mb-3">

          <label class="block text-xs text-slate-400 mb-1">Main File Name</label>
          <input id="main-file" type="text" value="index.js" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-sm mb-3">

          <label class="block text-xs text-slate-400 mb-1">Packages (comma separated)</label>
          <input id="packages" type="text" value="discord.js, dotenv" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-sm">
          <p class="text-[11px] text-slate-500 mt-1">Auto-detected from your code, or add manually.</p>
        </div>

        <div class="bg-slate-900 border border-slate-800 p-5 rounded-2xl">
          <h2 class="font-semibold text-lg mb-2 text-indigo-400">2. Bot Token (.env)</h2>
          <p class="text-xs text-slate-400 mb-3">Optional. Packaged safely into a hidden .env file.</p>
          <textarea id="env-content" rows="4" placeholder="DISCORD_TOKEN=your_token_here&#10;PREFIX=!" class="w-full bg-slate-950 border border-slate-800 rounded-lg p-3 text-xs font-mono focus:outline-none focus:border-indigo-500"></textarea>
        </div>

        <button onclick="downloadBundle()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3.5 rounded-xl shadow-lg shadow-emerald-950/50 transition flex items-center justify-center gap-2">
          <span>📦 Download Host-Ready .ZIP</span>
        </button>
      </div>

      <!-- Right Column: Code Editor -->
      <div class="md:col-span-2 bg-slate-900 border border-slate-800 p-5 rounded-2xl flex flex-col">
        <div class="flex justify-between items-center mb-3">
          <h2 class="font-semibold text-lg text-indigo-400">3. Paste or Upload Bot Code</h2>
          <label class="cursor-pointer bg-slate-800 hover:bg-slate-700 text-xs px-3 py-1.5 rounded-lg transition">
            📂 Load .js File
            <input type="file" accept=".js" onchange="loadFile(event)" class="hidden">
          </label>
        </div>

        <textarea id="bot-code" oninput="detectPackages()" rows="18" placeholder="// Paste your Node.js bot code here..." class="w-full flex-1 bg-slate-950 border border-slate-800 rounded-xl p-4 text-sm font-mono text-emerald-300 focus:outline-none focus:border-indigo-500">require('dotenv').config();
const { Client, GatewayIntentBits } = require('discord.js');

const client = new Client({ intents: [GatewayIntentBits.Guilds] });

client.once('ready', () => {
  console.log(`Logged in as ${client.user.tag}!`);
});

client.login(process.env.DISCORD_TOKEN);</textarea>
      </div>

    </div>
  </main>

  <script>
    // ==========================================
    // 🔑 PASTE YOUR SUPABASE KEYS HERE
    // ==========================================
    const SUPABASE_URL = 'YOUR_SUPABASE_URL';
    const SUPABASE_ANON_KEY = 'YOUR_SUPABASE_ANON_KEY';
    // ==========================================

    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // Check active session on load
    supabaseClient.auth.onAuthStateChange((event, session) => {
      if (session) {
        document.getElementById('auth-section').classList.add('hidden');
        document.getElementById('app-section').classList.remove('hidden');
        document.getElementById('user-nav').classList.remove('hidden');
        document.getElementById('user-email').textContent = session.user.email;
      } else {
        document.getElementById('auth-section').classList.remove('hidden');
        document.getElementById('app-section').classList.add('hidden');
        document.getElementById('user-nav').classList.add('hidden');
      }
    });

    async function signUp() {
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const { error } = await supabaseClient.auth.signUp({ email, password });
      document.getElementById('auth-msg').textContent = error ? error.message : 'Check your email for the confirmation link!';
    }

    async function signIn() {
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
      if (error) document.getElementById('auth-msg').textContent = error.message;
    }

    async function logout() {
      await supabaseClient.auth.signOut();
    }

    // Load local .js file into editor
    function loadFile(event) {
      const file = event.target.files[0];
      if (!file) return;
      document.getElementById('main-file').value = file.name;
      const reader = new FileReader();
      reader.onload = (e) => {
        document.getElementById('bot-code').value = e.target.result;
        detectPackages();
      };
      reader.readAsText(file);
    }

    // Auto-detect require('package') from code
    function detectPackages() {
      const code = document.getElementById('bot-code').value;
      const regex = /require\(['"]([^./][^'"]*)['"]\)/g;
      const found = new Set();
      let match;
      while ((match = regex.exec(code)) !== null) {
        found.add(match[1]);
      }
      if (found.size > 0) {
        document.getElementById('packages').value = Array.from(found).join(', ');
      }
    }

    // Generate package.json & download ZIP
    async function downloadBundle() {
      const zip = new JSZip();
      const botName = document.getElementById('bot-name').value.trim() || 'my-bot';
      const mainFile = document.getElementById('main-file').value.trim() || 'index.js';
      const code = document.getElementById('bot-code').value;
      const envContent = document.getElementById('env-content').value.trim();
      const pkgList = document.getElementById('packages').value.split(',').map(p => p.trim()).filter(Boolean);

      const dependencies = {};
      pkgList.forEach(pkg => { dependencies[pkg] = "latest"; });

      const packageJson = {
        name: botName.toLowerCase().replace(/\s+/g, '-'),
        version: "1.0.0",
        main: mainFile,
        scripts: { start: `node ${mainFile}` },
        dependencies
      };

      zip.file(mainFile, code);
      zip.file("package.json", JSON.stringify(packageJson, null, 2));
      if (envContent) zip.file(".env", envContent);

      const blob = await zip.generateAsync({ type: "blob" });
      const link = document.createElement("a");
      link.href = URL.createObjectURL(blob);
      link.download = `${botName}-ready.zip`;
      link.click();
    }
  </script>
</body>
</html>
